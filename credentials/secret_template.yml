#################################################################
#                                                               #
#        ACCOUNTS CREDENTIALS. DO NOT COMMIT REAL SECRETS.      #
#                                                               #
# Point INSTACKUP_CREDENTIALS_FILE (or the legacy               #
# CREDENTIALS_HOME) to this file.                               #
#                                                               #
# - Every section is optional. Without "Google" or "AWS"        #
#   settings, instackup uses the platform's own identity        #
#   (Application Default Credentials / AWS default chain).      #
# - Values can reference environment variables: ${NAME} or      #
#   ${NAME:-default}. Keep secrets there (or in a secret        #
#   manager) and this file can be committed safely.             #
# - Any value can also be set or overridden with an             #
#   INSTACKUP_<SERVICE>__<CONNECTION>__<KEY> variable.          #
# - Service and connection names are case-insensitive.          #
#                                                               #
# Full guide: docs/credentials.md                               #
#                                                               #
#################################################################

Location: local


Google:
  default:
    project_id: project_id
    project_name: project_name
    project_number: "000000000000"
    # Key file path, absolute or relative to this file. Omit to use
    # Application Default Credentials (recommended in production).
    service_account_file: api_key.json


AWS:
  default:
    # Omit both to use the AWS default credential chain (recommended).
    access_key: ${AWS_ACCESS_KEY_ID}
    secret_key: ${AWS_SECRET_ACCESS_KEY}
    region: us-east-2


RedShift:
  default:
    # Used by RedShiftTool.unload_to_S3 instead of embedding AWS keys.
    iam_role: arn:aws:iam::123456789012:role/redshift-unload
    cluster_credentials:
      dbname: db
      user: masteruser
      host: blablabla.random.us-east-2.redshift.amazonaws.com
      cluster_id: cluster
      port: 5439
    master_password:
      dbname: db
      user: masteruser
      host: blablabla.random.us-east-2.redshift.amazonaws.com
      password: ${REDSHIFT_PASSWORD}
      port: 5439


PostgreSQL:
  default:
    dbname: postgres
    user: postgres
    host: localhost
    password: ${POSTGRES_PASSWORD:-}
    port: 5432
  analytics:
    # A connection URL works too (e.g. Heroku's DATABASE_URL).
    url: ${DATABASE_URL:-postgresql://reader@localhost:5432/analytics}


MySQL:
  default:
    dbname: mydb
    host: localhost
    user: root
    password: ${MYSQL_PASSWORD:-}
    port: 3306
